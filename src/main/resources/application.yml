server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: users-service

  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/users_db}
    username: ${DB_USER:users_app}
    password: ${DB_PASSWORD:users_app}
    pool:
      enabled: true
      initial-size: 3
      max-size: 10
      max-idle-time: 30m

  flyway:
    enabled: true
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/users_db}
    user: ${DB_USER:users_app}
    password: ${DB_PASSWORD:users_app}
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: PT1H
    issuer: users-service
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  admin:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin12345}
    firstname: Администратор
    lastname: Системный

logging:
  level:
    ru.urfu.users: INFO
    org.springframework.r2dbc: WARN
